# Discovery: where to look for Shorts. Hashtag pages give the most reliable Shorts lists.
discovery:
  hashtags: [shorts, trending, fyp, facts, motivation, funny, story, storytime, lifehacks, money, ai, history, psychology, science]
  search_queries: []            # YouTube search pages hide Shorts from yt-dlp; leave empty unless that changes
  per_source_limit: 40          # flat entries pulled per hashtag/search page
  max_candidates: 120           # full-metadata fetches per stage (each is ~1-2s)
  channels_to_follow: 30        # stage 2: pull the newest Shorts of the 30 fastest-growing channels found
  shorts_per_channel: 6
  max_age_days: 21              # ignore uploads older than this (not "trending" any more)
  fallback_max_age_days: 90     # relax to this if fewer than min_candidates survive
  min_candidates: 20
  max_duration_seconds: 180     # YouTube Shorts are up to 3 minutes
  fetch_transcripts: true
  transcript_chars: 700         # chars of transcript given to the judge (the hook lives here)
  workers: 3                    # parallel metadata fetches; higher trips YouTube's bot check sooner
  request_spacing_seconds: 0.7  # pause between yt-dlp requests inside each worker
  source: auto                  # auto = YouTube Data API first (never bot-blocked) plus yt-dlp while it works | api | ytdlp
  api:
    searches_per_refresh: 4     # 100 quota units each (10,000 a day per Google project, shared with uploads
                                # unless YOUTUBE_API_KEY belongs to another project); rotates through the hashtags
    days: 7                     # only Shorts published in the last N days
    region: US
    language: en
    transcripts_for_top: 40     # yt-dlp transcripts for the most-viewed API finds, while yt-dlp is not blocked
  cookies_from_browser: null    # e.g. chrome / firefox / edge: lets yt-dlp use your logged-in YouTube cookies
                                # (fewer bot checks). Off by default because it reads your browser profile.

# Ranking weights (must be positive; normalised in code). Change them, re-run `rank` - no re-judging needed.
ranking:
  weights:
    velocity: 0.35        # views per hour since upload (log-scaled, batch-normalised)
    engagement: 0.15      # likes+comments per view
    replicable: 0.25      # TypeSafe Score: can a faceless pipeline make this?
    hook: 0.15            # TypeSafe Score: hook strength
    evergreen: 0.10       # TypeSafe Score: still worth watching next month?
  min_english_noul: 0.6   # drop Shorts a general English-speaking audience would not follow
  max_promo_noul: 0.6     # drop ads / sponsored / channel-promo Shorts
  min_format_confidence: 0.35   # below this the format label is "uncertain" and excluded from blueprints
  min_blueprint_replicable: 0.6 # median replicability (0-1) a format needs to count as faceless-friendly;
                                # lower ones are still listed, marked [stretch], after the friendly ones
  max_per_channel: 2            # Shorts per channel that count toward a blueprint (stops repost spam looking like a trend)
  max_blueprints: 20            # blueprints kept per analysis (the scheduler considers the top N of these, see schedule)

# Production
production:
  voice: en-US-AndrewNeural   # any edge-tts voice; `edge-tts --list-voices`
  tts:
    engine: edge              # edge = Microsoft's online voices (exact word timings) | kokoro = free local voice for everything
    fallback: kokoro          # when edge-tts fails, voice with Kokoro (run `python main.py setup-voice` once; ~120 MB)
    kokoro_voice: am_michael  # e.g. am_michael, am_adam, af_heart, af_bella, bm_george
  voice_rate: "+8%"
  target_seconds: 40          # script length target (30-55 is the Shorts sweet spot)
  captions:
    style: bold_impact        # bold_impact | clean_sans | boxed | pop | minimal | neon (presets in captions.py)
    # Any of these override the preset when set: font, size, primary, highlight, highlight_box,
    # outline_color, outline, shadow, highlight_mode (color|box|pop|none), uppercase, position
    # (top|center|lower|bottom), words_per_caption, spacing. Extra fonts: drop .ttf files in assets/fonts.
  words_per_caption: 3        # legacy; captions.words_per_caption wins when set
  font: Impact                # legacy; captions.font wins when set
  font_size: 96
  intro:
    enabled: false            # a title card before the hook costs viewers in the first second and breaks the loop
    mode: card                # card = generated title card; clip = your own assets/intro.mp4 (muted, music plays over it)
    text: "{title}"           # {title} is replaced by the video title
    seconds: 1.5
    clip: assets/intro.mp4
  outro:
    enabled: false            # a closing card breaks the loop (see loop_endings); turn on for a "Follow for more" card
    mode: card
    text: "Follow for more"
    handle: ""                # e.g. "@yourchannel", shown under the outro text
    seconds: 2.0
    clip: assets/outro.mp4
  originality:
    enabled: true             # avoid overused title/opening formulas (counted in recent uploads); vary the narrator
    voices: [en-US-AndrewNeural, en-US-BrianNeural, en-US-ChristopherNeural]   # rotated per Short; [] = always `voice`
  retitle:
    enabled: true             # 48 h after publishing, a Short in the bottom third gets its best alternative title once
    after_hours: 48
    max_per_sync: 2
  long_video:                 # produce --long / "Long video" in the console: your own script at full length
    orientation: landscape    # landscape (normal YouTube video, 1920x1080) | vertical
    caption_scale: 0.7        # caption size relative to the Shorts style (a landscape frame is shorter)
    max_image_checks: 1       # image checks per line (a long video has many lines)
    chapters: true            # YouTube chapters (timestamps) in the description, from Claude's section titles
  vision:                     # look at the footage the text check picked (TypeSafe images, experimental)
    mode: "off"               # off | log (judge and log, never reject) | on (a clip that does not show the line's
                              # subject or contradicts its setting is replaced by the next candidate)
    model: jev-1.14.0
    min_shows: 0.5            # P(the frame shows what the line is about) needed to keep a clip
    max_conflict: 0.5         # P(it contradicts the line's setting, place or animal, or does not belong in a video
                              # about the title, e.g. a person smoking in a lion video) that rejects a clip
    max_checks: 4             # image checks per line, about 4,000 input tokens each
  reference_images:           # real photos of the specific landmark, person, ship or artwork a line is about,
    enabled: true             # from Wikimedia Commons (free licences); each photo used is credited in the description
    min_match: 0.7            # how sure TypeSafe must be that the photo shows that very thing
    min_width: 800
  loop_endings: true          # last line runs straight into the first so the Short replays seamlessly (replays count as views);
                              # the voice's lead-in silence is cut and the video ends 0.15 s after the last word
  subject_screening:          # before writing: Claude proposes subjects, TypeSafe scores curiosity, how visual, demand, repeats;
    enabled: true             # only the best is written (not for sequels or viewer ideas, which have their subject)
    candidates: 6
  series_links:               # a topic series Short says "Part N of the <series> series" and links the previous part and part 1
    enabled: true             # in its description; the previous part's description gets "Next part"; both get a comment once public
    comments: true
    update_previous: true
  hook_tournament:            # after QA: alternative first sentences compete; the best replaces the hook if clearly better
    enabled: true
    candidates: 4
    min_gain: 0.05
  render_check:               # look at the finished video: black stretches (ffmpeg), captions over faces, cut-off text,
    enabled: true             # blank frames (TypeSafe images); a severe problem holds the Short for review
  fact_check:                 # every claim searched on the web (Claude Code with web search) and judged by TypeSafe before voicing
    enabled: true
    mode: fix                 # fix = wrong claims are corrected in the script | review = wrong claims only hold the Short | off
    custom: review            # your own scripts (pasted, from a file, long videos): review = doubtful claims are listed and the
                              # video waits for you, your words are never changed | fix = corrected like generated scripts | off
    max_unverified: 2         # more unverifiable main claims than this: the Short waits for your review instead of auto-upload
    sources_in_description: true
    max_sources: 3
  hook_overlay:
    enabled: true             # the video's punchiest words as big text at the top from the first frame
    max_seconds: 3.5
  search_titles:
    enabled: true             # rewrite the title around phrases people type into YouTube search; TypeSafe picks the best
    variants: 3
    region: US
  thumbnail:
    enabled: true             # 1080x1920 thumbnail.jpg per video: first footage frame + dark band + 3-6 word line
    band: true                # dark band behind the text
    handle: ""                # shown small at the bottom; empty = use outro.handle
  polish:                     # visual polish on every render
    enabled: true
    crossfade: 0.25           # seconds of crossfade between background clips (0 = hard cuts); line timing is kept
    push_in: true             # a slow 6% push in / pull out on every clip
    hook_flash: true          # the first frames fade in from white, so the hook lands with a flash (replays too)
  sfx:                        # sound design, mixed under voice and music (assets/sfx: whoosh.wav, hit.wav; drop your own)
    enabled: true
    whoosh: true              # a soft whoosh on every background change
    hit: true                 # a low hit under the hook (Shorts only; it lands again on each replay)
    whoosh_db: -17
    hit_db: -9
  music:
    default: random           # none | random | part of a file name or title in assets/music
    pick: mood                # mood = with "random", TypeSafe picks the track whose title fits the script's mood (never the
                              # previous Short's track) | random = any track
    volume_db: -18            # music level relative to the voice; -14 louder, -22 quieter
    duck: true                # lower the music automatically while the voice speaks
    fade_seconds: 1.5
  encoder: auto               # auto = first working hardware encoder (NVIDIA NVENC, Intel Quick Sync, AMD AMF), else libx264
  background_source: auto     # auto | pexels | generated
  ai_images:
    enabled: true
    mode: fallback            # only = every shot an AI image (produce --ai-images-only does this for one video) |
                              # fallback = only when nothing on Pexels/Pixabay fits | compete = also when the best clip is a
                              # weak match: the image check judges both and the better one is used (needs vision on;
                              # never for real named places or people) | always = AI image for every line | never
    compete_below: 0.85       # compete: try an AI image when the best clip shows the line less than this
    compete_margin: 0.10      # ...and use it when it shows the line at least this much better
    max_per_video: 4          # AI images per video at most (each takes a few seconds and may use provider credits)
    pollinations_model: black-forest-labs/flux.2-klein-4b   # with a pollen key (POLLINATIONS_TOKEN): 0.005 pollen an
                              # image; also good: tongyi-mai/z-image-turbo (0.004), black-forest-labs/flux.1-schnell (0.002)
    provider: pollinations    # pollinations (free, no key) | together (TOGETHER_API_KEY) | huggingface (HF_TOKEN) | openai (OPENAI_API_KEY, paid)
    model: ""                 # optional model id for together / huggingface / openai, e.g. black-forest-labs/FLUX.1-schnell
    style: "cinematic photograph, natural light, realistic, sharp detail, vertical composition, no text, no watermark, no logo"
  cache_max_gb: 4             # downloaded Pexels clips kept for reuse; least recently used are deleted beyond this
  cleanup:
    clean_after_upload: true  # delete the render pieces (background clips, voice, caption files) once a Short is uploaded
    keep_video_days: 0        # delete the video file this many days after upload (0 = at the next cleanup, after
                              # every production; YouTube has it); null = keep forever. Low disk: deleted regardless
    keep_unuploaded_days: 30  # never-uploaded Shorts keep their video this long; null = keep forever
                              # script, details and thumbnail always stay (history, analytics and the cards need them)
  min_free_gb: 3              # below this much free disk: uploaded videos, then old footage go; else the production stops
  script_backend: auto        # auto | api | claude_code | ollama  (api = ANTHROPIC_API_KEY; claude_code = your Claude subscription; ollama = free local model)
  ollama:
    fallback: true            # when Claude is unavailable (missing, signed out, usage limit, offline), write with the local model
    model: qwen2.5:3b         # any model pulled with `ollama pull`; bigger (qwen2.5:7b, gemma3:4b) writes better but slower
    url: http://127.0.0.1:11434
    timeout_seconds: 900
  script_max_attempts: 3      # regenerate if TypeSafe QA says the hook is weak
  script_min_hook_score: 2    # 0-3, see judge.SCRIPT_QA_QUESTIONS

notifications:
  budgets:                    # daily usage alerts on Telegram (0 = off); YouTube API quota alerts at 80% always
    typesafe_tokens_per_day: 0
    pollen_per_day: 0
  telegram:
    on_produce: true          # send every finished Short (video + title + description + hashtags) to TELEGRAM_CHAT_ID
    alerts: true              # message you when a scheduled/automatic job fails, with the fix (same problem at most every 3 h)
    daily_report_hour: 22     # one summary a day at this hour (produced, uploaded, queued, failed, best videos); null = off
    commands: true            # obey /status, /queue, /uploads, /publish N, /drafts, /reply N, /pause ... from TELEGRAM_CHAT_ID only

# Built-in scheduler (runs while the web console is running; see README "Run it on a schedule")
schedule:
  enabled: false
  produces_per_day: 20        # Shorts to write, render and send per day, evenly spaced over the window below
  refresh_per_day: 2          # discover + judge + rank + analyze runs per day (keeps the ranking current)
  start_hour: 6               # active window, local time (24 = midnight)
  end_hour: 24
  blueprints_to_rotate: 12    # consider at most the top N trend blueprints (your channel's own winners are always added)
  selection: weighted         # weighted = produce in proportion to opportunity score | rotate = round robin
  min_share: 0.2              # only blueprints scoring at least 20% of the best one get produced
  skip_stretch: true          # never auto-produce formats that need a person on camera
  channel_feedback: true      # scale weights by how each format x topic performs on your channel (needs YOUTUBE_API_KEY + YOUTUBE_CHANNEL)
  catch_up: true              # after the console was off, run the latest missed slot once (never all of them)
  retry_failed: true          # a production that failed for a temporary reason (network, render, voice) runs once more 30 min later
  skip_when_queue_full: true
  source: trends              # trends | profile (a cloned channel style) | topic (series of your own) | dub (second-language channel)
  topics: []                  # when source = topic: series rotated through, e.g. ["bible stories", "space facts"]
  trends:                     # fast trend reaction: Google's daily search trends (free), screened by TypeSafe; the Short is
    enabled: true             # fact-checked strictly, jumps the upload queue and goes public at the earliest good hour
    checks_per_day: 4
    max_per_day: 1
    region: US
    min_traffic: 1000         # searches a spike needs on the feed's coarse scale (500+, 1K+, 2K+, 20K+)
    min_fit: 0.7              # how well a narrated explainer can cover it (0-1); scores and schedules fall below this
    max_risk: 0.3             # stricter than a normal Short: death, crime, politics, private people, health or money advice
    repeat_days: 14           # never the same spike twice within this
  compilations:               # once a week: the best uploaded Shorts on one topic stitched into a landscape video with chapters
    enabled: true
    weekday: 6                # 0 = Monday ... 6 = Sunday
    hour: 11
    window_days: 7            # Shorts uploaded in the last week; their video files are kept this long when they do well
    min_parts: 4              # a topic needs at least this many Shorts this week
    max_parts: 8
    card_seconds: 1.6         # title card before each part
    upload: true              # upload it (private, like every upload) when done; false = only render and send to Telegram
  seasonal:                   # the writer is told what is coming up (holidays, "on this day" anniversaries) and may use it
    enabled: true
    lead_days: 6
    on_this_day: true
    regions: [US, NG]
  specials:
    explore_share: 0.2        # share of productions that try a format x topic never made on this channel
    sequels: true             # make a "Part 2" of uploads that beat the channel's typical views per hour by sequel_factor
    sequels_per_day: 1
    sequel_factor: 3.0
    sequel_min_views: 300
    ideas: true               # turn comments that ask for a topic into a Short, and reply to the viewer with the link
    ideas_per_day: 1
  tuning:
    learn_volume: true        # daily upload limit learned from views per day at each upload volume (min 3/day)
    learn_length: true        # script length learned from views and retention by video length (18-55 s)  # skip a production slot while the upload queue already holds a day's worth of uploads

comments:
  enabled: true               # needs Connect comments in the console (youtube.force-ssl permission)
  post_questions: true        # post each Short's question as the channel's first comment once it is public
  auto_reply: false           # false = reply drafts wait in the console; true = post them (never the ones that need you)

dub:                          # only used by a second-language channel whose schedule.source is "dub"
  language: es                # es | pt | fr | de | hi
  voice: ""                   # empty = the default native voice for the language (es: es-MX-JorgeNeural)
  source_channel: main        # the channel whose best Shorts are dubbed
  min_lift: 1.0               # dub Shorts with at least this x the source channel's median views per hour

update:                       # self-update from GitHub (Overview card button, /update on Telegram, or nightly)
  auto: false                 # true = pull and restart by itself every night at `hour` when nothing is running
  hour: 4
  branch: main

backup:
  enabled: true               # nightly zip of what the engine learned (never tokens or keys)
  folder: ""                  # empty = OneDrive\ShortsBackups when OneDrive is set up, else ShortsBackups in your user folder
  keep: 14
  hour: 3

upload:
  approval:                   # every finished Short waits for your 👍 on Telegram (buttons under the video, or /approve N)
    enabled: false
    timeout_hours: 12         # no answer in this long: uploaded anyway when auto_approve_on_timeout is true, else keeps waiting
    auto_approve_on_timeout: true
  privacy: private            # private | unlisted | public
  auto: true                  # scheduled Shorts join the upload queue; the best ones upload automatically
  daily_limit: 20             # uploads per rolling 24 h; lowered automatically if YouTube refuses an upload
  min_priority: 30            # predicted priority (0-100) a Short needs to upload automatically; lower ones wait for you
  max_age_hours: 36           # a Short waiting longer than this is not uploaded automatically any more
  min_gap_minutes: 20         # spacing between automatic uploads
  schedule_publish: true      # automatic uploads (when privacy is private) go public by themselves at a good hour
  review_hours: 2             # ...but not before this many hours after the upload: your window to cancel
  max_per_hour: 2             # at most this many Shorts go public in the same hour
  publish_gap_minutes: 25     # and at least this many minutes apart
  horizon_hours: 24           # a Short waits at most this long for a good hour
  category_id: "22"           # 22 = People & Blogs, 24 = Entertainment, 27 = Education, 28 = Science & Technology
